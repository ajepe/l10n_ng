name: Tests

on:
  push:
    branches: ["18.0"]
  pull_request:

jobs:
  test-odoo:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: odoo
      DB_PASSWORD: odoo
      ODOO_VERSION: "18.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpq-dev \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libjpeg-dev \
            libffi-dev \
            libssl-dev \
            node-less \
            npm

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get install -y wkhtmltopdf || true

      - name: Install Odoo 18
        run: |
          python -m pip install --upgrade pip
          pip install odoo==18.*

      - name: Install Python dependencies (if any)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Odoo tests
        run: |
          odoo \
            --db_host=$DB_HOST \
            --db_port=$DB_PORT \
            --db_user=$DB_USER \
            --db_password=$DB_PASSWORD \
            --addons-path=addons,custom_addons \
            --init=all \
            --test-enable \
            --stop-after-init \
            --log-level=test \
            --without-demo=all

